# VCAMTESTING2 BYTETRACK CONFIG
# Reconstructed from results/raw/vcamtesting2_bytetrack_config_used.yaml.
# Numeric parameters are retained exactly from that frozen run snapshot.

experiment:
  experiment_id: "vcamtesting2_bytetrack"
  description: "vcamtesting2 ByteTrack run with a horizontal line at y=0.7992"

video:
  source: "../data/videos/vcamtesting2.mp4"
  save_annotated_video: true
  process_every_nth_frame: 1

detection:
  model_weights: "../models/yolo11n.pt"
  device: "cpu"
  confidence_threshold: 0.30
  iou_threshold: 0.45
  target_classes: [0]
  input_image_size: 640

tracker:
  type: "bytetrack"

  bytetrack:
    track_activation_threshold: 0.25
    lost_track_buffer: 30
    minimum_iou_threshold: 0.8
    minimum_consecutive_frames: 2

  botsort:
    track_activation_threshold: 0.25
    lost_track_buffer: 30
    minimum_iou_threshold_first_assoc: 0.2
    minimum_iou_threshold_second_assoc: 0.5
    minimum_iou_threshold_unconfirmed_assoc: 0.3
    minimum_consecutive_frames: 2
    high_conf_det_threshold: 0.6
    enable_cmc: true
    cmc_method: "sparseOptFlow"

# Horizontal counting segment from x=0.1792 to x=0.6792 at y=0.7992.
line:
  x1: 0.1792
  y1: 0.7992
  x2: 0.6792
  y2: 0.7992
  in_is_downward: true

occupancy:
  initial_occupancy: 0
  clamp_minimum_zero: true

logging:
  output_dir: "../results"
  save_raw_detections: false
