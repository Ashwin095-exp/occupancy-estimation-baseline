# =============================================================================
# V00 CALIBRATION CONFIG
# Vertical counting line at the LED tip's x-coordinate, projected to ground.
#
# HOW THIS LINE WAS DERIVED (for reproducibility):
#   Video: Test_v00.mp4, resolution 478x850 (portrait).
#   The LED/light-tube fixture's visible tip (its near end, closest to the
#   camera) was located by cropping the frame around the fixture and
#   overlaying a pixel grid, giving tip pixel coordinates x = 393 px.
#   Normalized: x = 393 / 478 = 0.8222
#
#   Per instruction, the virtual counting line is the VERTICAL projection
#   of that x-coordinate down to the ground — i.e. a vertical line at
#   x_normalized = 0.8222, spanning the full frame height (y: 0.0 to 1.0).
#   This is NOT the LED itself used as the line, and it is NOT diagonal.
#
# KNOWN LIMITATION (see README.md "V00 Calibration Findings" for full
# detail): even with this correctly-placed line, V00 does not currently
# produce a clean 1 IN / 1 OUT result with the frozen baseline, because the
# subject's bounding box is very wide relative to the frame (camera is
# positioned close to the subject), which interacts poorly with standard
# line-crossing logic, compounded by track-ID fragmentation under the same
# close/fast motion. This is a camera-positioning finding from calibration,
# not a bug — the baseline algorithm is unmodified and untuned for V00.
# =============================================================================

experiment:
  experiment_id: "v00_calibration"
  description: "V00 calibration — vertical line at LED-tip x-coordinate (x=0.8222), projected to ground"

video:
  source: "../data/videos/Test_v00.mp4"
  save_annotated_video: true
  process_every_nth_frame: 1

detection:
  model_weights: "../models/yolo11n.pt"
  device: "cpu"
  confidence_threshold: 0.30
  iou_threshold: 0.45
  target_classes: [0]
  input_image_size: 640

tracker:
  type: "bytetrack"                 # "bytetrack" | "botsort" — switch here, no code change needed

  bytetrack:
    track_activation_threshold: 0.25
    lost_track_buffer: 30
    minimum_iou_threshold: 0.8
    minimum_consecutive_frames: 2

  botsort:
    track_activation_threshold: 0.25
    lost_track_buffer: 30
    minimum_iou_threshold_first_assoc: 0.2
    minimum_iou_threshold_second_assoc: 0.5
    minimum_iou_threshold_unconfirmed_assoc: 0.3
    minimum_consecutive_frames: 2
    high_conf_det_threshold: 0.6
    enable_cmc: true
    cmc_method: "sparseOptFlow"

# Vertical line at the LED tip's x-coordinate, full frame height.
# x1 == x2 == 0.8222  ->  this makes it VERTICAL, not diagonal.
line:
  x1: 0.8222
  y1: 0.0
  x2: 0.8222
  y2: 1.0
  # Determined empirically for this camera setup: walking left-to-right
  # (away from camera start position) = IN; right-to-left = OUT.
  in_is_downward: true

occupancy:
  initial_occupancy: 0
  clamp_minimum_zero: true

logging:
  output_dir: "../results"
  save_raw_detections: false
